# Render Blueprint — New → Blueprint → point at this repo.
# Secrets use `sync: false` so Render prompts for them (never commit real values).
# The SQLite DB lives on a PERSISTENT DISK (/data), not the repo — required so data
# survives deploys and so it's on a real filesystem (SQLite + OneDrive don't mix).
services:
  - type: web
    name: futuro-pulse
    runtime: node
    plan: starter
    buildCommand: npm install
    # Schema + admin are initialized at RUNTIME (db/db.js -> init-schema.js), because the
    # persistent disk is not mounted during pre-deploy — initializing there would create the
    # schema on an ephemeral filesystem the running app never sees.
    startCommand: npm start
    autoDeploy: true
    disk:
      name: owna-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DB_PATH
        value: /data/owna.db          # on the persistent disk
      - key: SESSION_SECRET
        generateValue: true
      # OWNA
      - key: OWNA_API_KEY
        sync: false
      - key: OWNA_BASE_URL
        value: https://api.owna.com.au
      - key: SNAPSHOT_WINDOW_DAYS
        value: 120
      - key: SNAPSHOT_FORWARD_DAYS
        value: 240
      - key: SNAPSHOT_CRON
        value: 15 2 * * *          # 02:15 Australia/Sydney (zone pinned in server.js)
      - key: EXIT_LOOKBACK_DAYS
        value: 365
      # ===== Retention periods — the owner's decision of 14 September 2026 =====
      # Enforced by services/retention.js: the last step of the nightly snapshot, and `npm run purge`
      # on demand. The numbers below ARE the approved periods; they live here so a period can be
      # changed without a code change (services/retention.js holds the same values as its defaults, so
      # an unset variable still purges to the approved period). A value that is not a positive whole
      # number is ignored and the approved default stands — it is never read as "keep nothing".
      # Occupancy, wages and incident numbers carry no personal data and are kept indefinitely; there
      # is deliberately no variable for them. A signed-in session stays valid 8 hours from the last
      # request, which middleware/session.js enforces and this job does not duplicate.
      - key: RETAIN_AI_BRIEFINGS_MONTHS
        value: 12                  # cached weekly AI briefings
      - key: RETAIN_FEEDBACK_MONTHS
        value: 12                  # staff feedback, measured from the REVIEW, and only once reviewed or
                                   # dismissed — a row still marked 'new' is never deleted
      - key: RETAIN_RUN_LOG_DAYS
        value: 90                  # nightly snapshot_runs rows and their notes
      - key: RETAIN_EXIT_DETAIL_MONTHS
        value: 24                  # child_exits row-level detail (2 years)
      - key: RETAIN_EXIT_AGGREGATE_MONTHS
        value: 84                  # exits_monthly counts (7 years) — outlives the detail above
      # Set to 0 only if the VACUUM that gives the deleted rows' pages back ever becomes too slow to
      # sit inside the nightly run. The deletions themselves happen either way.
      - key: RETENTION_RECLAIM
        value: 1
      # LineLeader (ChildcareCRM)
      - key: LINELEADER_BASE_URL
        value: https://live.childcarecrm.com.au
      - key: LINELEADER_USERNAME
        sync: false
      - key: LINELEADER_PASSWORD
        sync: false
      # Employment Hero Payroll (KeyPay)
      - key: EH_PAYROLL_BASE_URL
        value: https://api.yourpayroll.com.au
      - key: EH_PAYROLL_API_KEY
        sync: false
      - key: EH_PAYROLL_BUSINESS_ID
        sync: false
      - key: EH_LABOUR_WEEKS
        value: 16
      # Default admin (change password after first login)
      - key: ADMIN_EMAIL
        sync: false
      # The address people actually use, if a proxy forwards neither Host nor X-Forwarded-Host
      # intact. Writes whose Origin matches it are accepted; leave unset unless a form is refused.
      # Set to 1 to put the whole dashboard behind the "under construction" holding page. Sign-in
      # still works and admin/ops still get the real dashboard, so work can carry on behind it.
      # Change it in the Render dashboard and restart — no code deploy needed.
      - key: MAINTENANCE
        value: 0
      - key: PUBLIC_HOSTNAME
        value: futuro-pulse.onrender.com
      - key: PRIVACY_CONTACT
        value: the Privacy Officer
      - key: AI_ASK_PER_HOUR
        value: 20
      - key: AI_DAILY_CAP
        value: 300
      # Host clock. Nothing the dashboard decides or reports depends on it: the nightly cron pins the
      # zone in server.js, every date-level decision goes through services/calendar.js today(), and the
      # "data as at" sync stamps go through sydneyStamp() in the same module, which pins it too.
      # Setting it keeps the container's own logs — and the LineLeader tour times views still format
      # directly — in Sydney time.
      - key: TZ
        value: Australia/Sydney
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
